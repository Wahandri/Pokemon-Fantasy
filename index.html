<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#3b5ea8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Pokémon League Online</title>
    <style>
      html, body { margin: 0; padding: 0; background: #0b0f14; overflow: hidden; }
      #game { width: 100vw; height: 100vh; display: grid; place-items: center; position: relative; }
      canvas { image-rendering: pixelated; }
      #trainer-overlay {
        position: absolute; top: 8px; left: 0; right: 0; z-index: 10;
        display: none; flex-direction: column; align-items: center; gap: 6px;
        font-family: monospace;
      }
      #trainer-overlay .t-title { color: #f8fafc; font-size: 16px; letter-spacing: 1px; }
      #trainer-name-input {
        padding: 8px 12px; border-radius: 8px; border: 2px solid #5b7cc0;
        background: #0f1830; color: #fff; text-align: center;
        font-family: monospace; font-size: 14px; outline: none; width: 220px;
      }
    </style>
  </head>
  <body>
    <div id="game">
      <div id="trainer-overlay">
        <div class="t-title">ELIGE TU ENTRENADOR</div>
        <input id="trainer-name-input" placeholder="Nombre de entrenador" maxlength="12" />
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
